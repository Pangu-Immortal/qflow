name: npm package execution

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "skills/**"
      - "design/**"
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Version of the installed and executed tarball
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

concurrency:
  group: npm-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the local media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Read the package version
        id: version
        run: node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
      - name: Build the npm package and README
        run: npm run pack:distribution
      - name: Install, render and export outside the checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run check:distribution -- "$PWD/dist/release/qflow-qflow-$VERSION.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            dist/release/*.tgz
            dist/release/README.md
          if-no-files-found: error
