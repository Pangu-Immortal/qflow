name: Publish npm
run-name: "npm ${{ github.event.release.tag_name || inputs.version }} — ${{ (github.event_name == 'release' || inputs.publish) && 'publish' || 'package only' }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in main's package.json"
        type: string
        required: true
      publish:
        description: "Publish to npm (unchecked: checks and downloadable package only)"
        type: boolean
        default: false
      packages:
        description: "Optional space-separated package names to publish; empty publishes the complete candidate"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Confirm version and main ancestry
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('package.json must declare a stable npm version.');
          }
          if (process.env.EVENT_NAME === 'release') {
            if (process.env.PRERELEASE === 'true' || process.env.RELEASE_TAG !== `v${version}`
              || process.env.GITHUB_REF !== `refs/tags/v${version}`) {
              throw new Error('Publish a stable Release tagged v<package.json version>.');
            }
          } else if (version !== process.env.EXPECTED_VERSION) {
            throw new Error('Enter the stable version already committed in main/package.json.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    needs: version
    uses: ./.github/workflows/npm-package.yml

  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: [checks, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release
      - name: Publish the explicitly selected packages in dependency order
        env:
          RELEASE_PACKAGES: ${{ inputs.packages }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const names = (process.env.RELEASE_PACKAGES ?? '').trim().split(/\s+/).filter(Boolean);
          execFileSync(process.execPath, [
            'scripts/publish-release-candidate.mjs', 'release/release-plan.json',
            ...names.map(name => `--package=${name}`),
          ], { stdio: 'inherit' });
          JS

  release-assets:
    if: github.event_name == 'release'
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release
      - name: Attach the package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          filename="qflow-qflow-$VERSION.tgz"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -Fxq "$filename"; then
            echo "Release already contains $filename; leaving it unchanged."
          else
            gh release upload "$RELEASE_TAG" "release/$filename"
          fi
