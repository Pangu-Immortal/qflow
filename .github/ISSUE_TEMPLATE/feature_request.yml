name: Feature request
description: Ask for a capability, format or workflow Qflow does not cover yet.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: The video or workflow you have in mind, and where Qflow stops short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like Qflow to do
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you have tried
      description: Workarounds, a reference video, or an existing component that covers part of it.
    validations:
      required: false
